<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>样张 B · 3D 低多边形</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}
.tag{position:fixed;left:12px;top:12px;font:600 13px system-ui;color:#fff;background:#0008;padding:6px 10px;border-radius:8px;text-decoration:none}</style></head>
<body><a class="tag" href="./">← 样张 B · 3D 低多边形</a>
<script type="module">
import * as THREE from './three.module.min.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);
r.shadowMap.enabled=true;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,400);cam.position.set(12,10,36);cam.lookAt(0,2.6,0);
// sky dome gradient
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:`varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 v;void main(){float t=clamp(v.y*1.6,0.,1.);vec3 lo=vec3(1.,.55,.32),mi=vec3(.55,.3,.5),hi=vec3(.06,.07,.2);
vec3 c=mix(lo,mi,smoothstep(0.,.3,t));c=mix(c,hi,smoothstep(.25,1.,t));float sun=max(0.,dot(v,normalize(vec3(-.5,.06,-1.))));c+=vec3(1.,.6,.3)*pow(sun,60.)*1.5+vec3(1.,.5,.3)*pow(sun,6.)*.3;gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(200,32,16),skyMat));
scene.fog=new THREE.Fog(0x9a5a6a,30,140);
// lights
scene.add(new THREE.HemisphereLight(0x9c88d8,0x3a2840,1.3));const fill=new THREE.DirectionalLight(0xff9a7a,.9);fill.position.set(20,10,30);scene.add(fill);
const sun=new THREE.DirectionalLight(0xffa066,2.2);sun.position.set(-20,8,-30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});scene.add(sun);
const flat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.85,...o});
// sea: faceted animated plane
const seaG=new THREE.PlaneGeometry(260,260,90,90);seaG.rotateX(-Math.PI/2);
const seaM=flat(0x34548a,{roughness:.3,metalness:.15});const sea=new THREE.Mesh(seaG,seaM);sea.receiveShadow=true;scene.add(sea);
const base=seaG.attributes.position.array.slice();
// island
const isl=new THREE.Mesh(new THREE.CylinderGeometry(6,8.5,3,9,2),flat(0x5a4a5a));isl.position.y=-.4;isl.castShadow=isl.receiveShadow=true;
{const p=isl.geometry.attributes.position;for(let i=0;i<p.count;i++){p.setY(i,p.getY(i)+(Math.sin(i*12.9)*.35));p.setX(i,p.getX(i)*(1+Math.sin(i*7.1)*.08))}isl.geometry.computeVertexNormals()}
scene.add(isl);
const grass=new THREE.Mesh(new THREE.CylinderGeometry(5.6,6,.5,9),flat(0x4f6a48));grass.position.y=1.25;grass.receiveShadow=true;scene.add(grass);
for(const [x,z,s] of [[-5,4,1.4],[6,2,1],[4,-5,1.6],[-6,-3,1.1],[8,5,.7]]){const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),flat(0x463a4a));rk.position.set(x,0,z);rk.castShadow=true;scene.add(rk)}
// lighthouse
const tw=new THREE.Group();scene.add(tw);tw.position.set(-1,1.5,-.5);
const segs=6;for(let i=0;i<segs;i++){const h=1.2,r0=1.25-i*.09,r1=r0-.09;const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,h,12),flat(i%2?0xb0353a:0xece4da));m.position.y=h*i+h/2;m.castShadow=true;tw.add(m)}
const gal=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.05,.15,12),flat(0x2a2a34));gal.position.y=7.3;tw.add(gal);
const lampM=new THREE.MeshStandardMaterial({color:0xffe3a0,emissive:0xffc860,emissiveIntensity:3});
const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,.9,10),lampM);lamp.position.y=7.85;tw.add(lamp);
const roof=new THREE.Mesh(new THREE.ConeGeometry(.85,.9,10),flat(0x2c2c3a));roof.position.y=8.75;tw.add(roof);
const ptl=new THREE.PointLight(0xffc070,30,18,1.6);ptl.position.y=7.85;tw.add(ptl);
// windows
for(const y of [2.6,4.6]){const w=new THREE.Mesh(new THREE.BoxGeometry(.25,.4,.1),new THREE.MeshStandardMaterial({color:0xffd080,emissive:0xffb040,emissiveIntensity:2}));w.position.set(.35,y,1.05);tw.add(w)}
// beam: additive cone
const beamM=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
vertexShader:`varying float vy;varying vec3 vn;varying vec3 vp;void main(){vy=uv.y;vn=normalize(normalMatrix*normal);vp=(modelViewMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying float vy;varying vec3 vn;varying vec3 vp;void main(){float e=pow(abs(dot(vn,normalize(-vp))),1.5);gl_FragColor=vec4(vec3(1.,.82,.5)*vy*vy*e*.55,1.);}`});
const beamG=new THREE.ConeGeometry(2.6,26,24,1,true);beamG.translate(0,-13,0);beamG.rotateZ(Math.PI/2);
const beam=new THREE.Group();const b1=new THREE.Mesh(beamG,beamM);beam.add(b1);const b2=b1.clone();b2.rotation.y=Math.PI;beam.add(b2);beam.position.y=7.85;tw.add(beam);
// cottage
const hut=new THREE.Group();hut.position.set(2.6,1.5,1.2);scene.add(hut);
const wall=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.4,1.8),flat(0xd8c8b0));wall.position.y=.7;wall.castShadow=true;hut.add(wall);
const rf=new THREE.Mesh(new THREE.ConeGeometry(1.75,1.1,4),flat(0x6a3a3a));rf.position.y=1.95;rf.rotation.y=Math.PI/4;rf.castShadow=true;hut.add(rf);
const win=new THREE.Mesh(new THREE.BoxGeometry(.4,.4,.05),new THREE.MeshStandardMaterial({color:0xffd080,emissive:0xffa030,emissiveIntensity:2.5}));win.position.set(.4,.8,.92);hut.add(win);
const hl=new THREE.PointLight(0xffa040,2,4);hl.position.set(.4,.8,1.4);hut.add(hl);
// dock + boat
const dock=new THREE.Mesh(new THREE.BoxGeometry(1.2,.2,5),flat(0x7a5a40));dock.position.set(4.5,.6,6.5);dock.castShadow=dock.receiveShadow=true;scene.add(dock);
for(const z of [4.5,6.5,8.6]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,2,6),flat(0x5a4030));p.position.set(4.5+(z>7?.55:-.55),0,z);scene.add(p)}
const boat=new THREE.Group();boat.position.set(6.6,.15,8);scene.add(boat);
const hull=new THREE.Mesh(new THREE.BoxGeometry(1.3,.6,3),flat(0x8a4a2a));hull.castShadow=true;boat.add(hull);
const bow=new THREE.Mesh(new THREE.ConeGeometry(.92,1.2,4),flat(0x8a4a2a));bow.rotation.set(Math.PI/2,Math.PI/4,0);bow.scale.set(.7,1,.33);bow.position.z=-2.05;boat.add(bow);
const mast=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,3,5),flat(0x4a3020));mast.position.y=1.6;boat.add(mast);
const sail=new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.3,0),new THREE.Vector3(0,3,0),new THREE.Vector3(0,.4,1.6)]),flat(0xeee0c8,{side:THREE.DoubleSide}));sail.geometry.computeVertexNormals();boat.add(sail);
const lan=new THREE.PointLight(0xffb050,4,4);lan.position.set(0,1,1.2);boat.add(lan);
// flotsam crates
const crates=[];for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.BoxGeometry(.6,.4,.6),flat([0x9a7050,0x5a8aa0,0xb08a4a][i%3]));c.position.set(-10+i*4.5,0,9+Math.sin(i*3)*3);scene.add(c);crates.push(c)}
// distant sea stacks
for(const [x,z,h] of [[-40,-60,9],[-30,-70,6],[35,-55,7]]){const s=new THREE.Mesh(new THREE.ConeGeometry(4,h,5),flat(0x4a3a5a));s.position.set(x,h/2-1,z);scene.add(s)}
// stars
const sg=new THREE.BufferGeometry();const sp=[];for(let i=0;i<500;i++){const a=Math.random()*Math.PI*2,y=.25+Math.random()*.75;const rr=Math.sqrt(1-y*y);sp.push(Math.cos(a)*rr*180,y*180,Math.sin(a)*rr*180)}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.7,fog:false,transparent:true,opacity:.8})));
// moon
const moon=new THREE.Mesh(new THREE.SphereGeometry(4,16,12),new THREE.MeshBasicMaterial({color:0xfff2dd,fog:false}));moon.position.set(40,70,-140);scene.add(moon);
const T0=performance.now()-(+new URLSearchParams(location.search).get('t')||3)*1000;
function loop(){const t=(performance.now()-T0)/1000;
const p=seaG.attributes.position;for(let i=0;i<p.count;i++){const x=base[i*3],z=base[i*3+2];p.array[i*3+1]=Math.sin(x*.35+t*1.1)*.15+Math.cos(z*.4+t*.9)*.15+Math.sin((x+z)*.9+t*2)*.06}
p.needsUpdate=true;seaG.computeVertexNormals();
beam.rotation.y=t*.7;boat.position.y=.15+Math.sin(t*1.3)*.12;boat.rotation.z=Math.sin(t*1.1)*.05;
crates.forEach((c,i)=>{c.position.y=Math.sin(t*1.2+i)*.15;c.rotation.y=t*.2+i;c.position.x+=.004;if(c.position.x>14)c.position.x=-14});
lampM.emissiveIntensity=2.6+Math.sin(t*3)*.3;
r.render(scene,cam);requestAnimationFrame(loop)}loop();
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
</script></body></html>
